<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>PANDA · متابعة الطلبيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0b0b0c;--panel:#151517;--panel2:#1c1c1f;--line:#26262a;--ink:#f4f4f2;--mute:#8d8c88;--soft:#5d5c58;
 --r3:#ff5a4e;--r2:#ff9f2e;--r1:#f2c94c;--cancel:#a7a7ad;--fix:#3ecf8e;--wait:#5b9dff;--wa:#25d366;
 --rad:16px;
}
@media (prefers-color-scheme:light){:root{--bg:#f5f4f1;--panel:#fff;--panel2:#f0efeb;--line:#e6e4de;--ink:#141414;--mute:#6f6e69;--soft:#a3a29c;--r1:#c99a00}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
header{padding:max(14px,env(safe-area-inset-top)) 0 12px;background:var(--bg)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 0 0 1px var(--line)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px}
.brand p{margin:0;font-size:12.5px;color:var(--mute)}
.sync{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:12px;color:var(--mute)}
.sync b{color:var(--ink);font-weight:600}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--fix);box-shadow:0 0 0 3px color-mix(in srgb,var(--fix) 25%,transparent)}
.rf{width:30px;height:30px;border-radius:50%;border:0;background:var(--panel2);cursor:pointer;display:grid;place-items:center}
.rf svg{width:15px;height:15px}
.rf.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* overview */
.over{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:6px}
.risk{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px}
.risk .lbl{font-size:12.5px;color:var(--mute)}
.risk .big{font-size:26px;font-weight:700;margin-top:2px}
.risk .big small{font-size:14px;font-weight:500;color:var(--mute)}
.bar{display:flex;height:6px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--panel2)}
.bar i{display:block;height:100%}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.prog .big{font-size:26px;font-weight:700}
.prog .track{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:12px}
.prog .track i{display:block;height:100%;background:var(--fix);transition:width .3s}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;margin-top:4px}
.tabrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab i{width:8px;height:8px;border-radius:50%}
.tab em{font-style:normal;font-size:12px;background:var(--panel2);border-radius:6px;padding:0 6px;min-width:20px;text-align:center}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.on em{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.search{margin-top:10px;position:relative}
.search input{width:100%;padding:10px 38px 10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--soft)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}

/* sections */
.sec{margin-top:14px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sh h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.sh h2 i{width:9px;height:9px;border-radius:50%}
.sh span{font-size:12px;color:var(--mute)}
.sh p{margin:2px 0 0;font-size:12px;color:var(--mute);font-weight:400}

/* item */
.it{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;margin-bottom:8px;overflow:hidden}
.it::before{content:"";position:absolute;inset-block:0;right:0;width:3px;background:var(--c)}
.r1x{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:15px;white-space:nowrap}
.amt small{font-weight:500;color:var(--mute);font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--mute);margin-top:3px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px;opacity:.8}
.prd{font-size:13px;margin-top:7px;padding:7px 9px;background:var(--panel2);border-radius:9px;color:var(--ink)}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.st{font-size:11.5px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:7px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.acts{display:flex;gap:6px}
.ab{height:36px;min-width:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600}
.ab svg{width:16px;height:16px}
.ab.call{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ab.wa{background:var(--wa);color:#04210f;border-color:var(--wa)}
.ab.done{padding:0}
.it.isdone{opacity:.5}
.it.isdone .ab.done{background:var(--fix);border-color:var(--fix);color:#04210f}
.trk{font-size:11px;color:var(--soft);margin-top:6px}

.donebox{margin-top:16px}
.donebox summary{list-style:none;cursor:pointer;font-size:13px;color:var(--mute);padding:10px 2px}
.donebox summary::-webkit-details-marker{display:none}
.empty{text-align:center;color:var(--mute);padding:46px 0;font-size:14px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--soft);font-size:11.5px;padding:22px 0 calc(70px + env(safe-area-inset-bottom))}

/* gate */
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;padding:20px}
#gate form{width:100%;max-width:330px;text-align:center}
#gate .logo{margin:0 auto 14px;width:64px;height:64px;font-size:34px;border-radius:18px}
#gate h2{margin:0;font-size:19px}
#gate p{margin:4px 0 20px;color:var(--mute);font-size:13.5px}
#gate input{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;text-align:center;letter-spacing:3px;outline:none}
#gate button{width:100%;margin-top:10px;padding:13px;border-radius:13px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;cursor:pointer}
#gate .err{color:var(--r3);font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<div id="gate">
 <form id="gateForm">
  <div class="logo">🐼</div>
  <h2>متابعة طلبيات PANDA</h2>
  <p>أدخلي رمز الدخول للمتابعة</p>
  <input id="pin" type="password" autocomplete="current-password" required>
  <button type="submit" id="gbtn">دخول</button>
  <div class="err" id="err"></div>
 </form>
</div>

<header><div class="wrap hd">
 <div class="brand"><div class="logo">🐼</div><div><h1>PANDA</h1><p>متابعة الطلبيات</p></div></div>
 <div class="sync"><span class="dotlive"></span><span>آخر تحديث <b id="upd" class="num">—</b></span>
  <button class="rf" id="rf" aria-label="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></div>
</div></header>

<main class="wrap">
 <section class="over">
  <div class="risk"><div class="lbl">مبالغ معرّضة للإرجاع</div><div class="big"><span id="riskAmt" class="num">0</span> <small>دج</small></div><div class="bar" id="riskBar"></div></div>
  <div class="prog"><div><div class="lbl" style="font-size:12.5px;color:var(--mute)">تمت متابعتها</div><div class="big num" id="progTxt">0/0</div></div><div class="track"><i id="progBar" style="width:0"></i></div></div>
 </section>

 <div class="tabs">
  <div class="tabrow" id="tabs"></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="بحث بالاسم، الهاتف، الولاية أو رقم التتبع"></div>
 </div>

 <div id="list"></div>
 <footer>يُحدَّث تلقائياً كل ساعة من 8:00 إلى 20:00 · علامة «تم» محفوظة على هذا الجهاز</footer>
</main>
<div class="toast" id="toast"></div>

<script>
const G=[
 {k:"r3",t:"آخر فرصة",full:"لا يرد — المحاولة 3",h:"سيُعاد الطرد قريباً. اتصلي فوراً.",c:"var(--r3)",m:"r3"},
 {k:"r2",t:"المحاولة 2",full:"لا يرد — المحاولة 2",h:"رسالة واتساب ثم اتصال.",c:"var(--r2)",m:"r1"},
 {k:"r1",t:"المحاولة 1",full:"لا يرد — المحاولة 1",h:"رسالة واتساب تكفي غالباً.",c:"var(--r1)",m:"r1"},
 {k:"cancel",t:"ملغاة",full:"ألغى الطلبية",h:"اسألي عن السبب وحاولي إنقاذها.",c:"var(--cancel)",m:"cancel"},
 {k:"fix",t:"عنوان / مؤجلة",full:"عنوان خاطئ أو مؤجلة",h:"أكّدي العنوان أو الموعد الجديد.",c:"var(--fix)",m:"fix"},
 {k:"wait",t:"في المكتب",full:"في المكتب بانتظار الزبون",h:"ذكّري الزبون بالاستلام.",c:"var(--wait)",m:"desk"}
];
const IC={
 call:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
 ph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg>',
 box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></svg>'
};
let DATA=null,PIN=null,filter="all",DONE=new Set();
try{DONE=new Set(JSON.parse(localStorage.getItem("panda_done")||"[]"))}catch(e){}
const saveDone=()=>{try{localStorage.setItem("panda_done",JSON.stringify([...DONE]))}catch(e){}};
const fmt=n=>Number(n).toLocaleString("fr-FR").replace(/ /g," ");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=n=>String(n).replace(/\s*\d{4,5}(\s*-\s*\d{4,5})?\s*$/,"").trim()||n;
const SIT={"Ne répond pas 1":"لا يرد · المحاولة 1","Ne répond pas 2":"لا يرد · المحاولة 2","Ne répond pas 3":"لا يرد · المحاولة 3","Commande annulée":"ألغى الطلبية","Commune erronée":"بلدية خاطئة","Reporté à une date ultérieure":"مؤجلة","Rendez-vous client programmé":"موعد مع الزبون","En attente du client":"بانتظار الزبون في المكتب"};
const sit=s=>SIT[s]||s;
const grp=k=>G.find(g=>g.k===k);
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1600)}
function place(p){const w=p.wilaya.replace(/^\d+\s/,"");return p.deliveryType==="pickup-point"?`مكتب ZR Express في ${p.commune} (ولاية ${w})`:`عنوانكم في ${p.commune}`}
function msg(t,p){
 const hi=`السلام عليكم ${clean(p.name)}،\nمعكم متجر PANDA لملابس الأطفال 🐼\n`;
 const o=`طلبيتكم: ${p.products}\nالمبلغ: ${fmt(p.amount)} دج\nرقم التتبع: ${p.tracking}\n`;
 if(t==="r3")return hi+`حاولت شركة التوصيل ZR Express الاتصال بكم عدة مرات دون رد، وستُعاد الطلبية قريباً إن لم تتواصلوا معنا.\n`+o+`الطلبية بانتظاركم في ${place(p)}.\nيُرجى الرد اليوم لنُبقيها محجوزة لكم 🙏`;
 if(t==="r1")return hi+`طلبيتكم وصلت، وحاول الموزّع الاتصال بكم دون رد.\n`+o+(p.deliveryType==="pickup-point"?`يمكنكم استلامها من ${place(p)}.\n`:`سيعيد الموزّع الاتصال بكم لتسليمها إلى ${place(p)}.\n`)+`متى يناسبكم الاستلام؟`;
 if(t==="desk")return hi+`طلبيتكم وصلت وهي جاهزة للاستلام ✅\n`+o+`مكان الاستلام: ${place(p)}.\nمتى ستمرّون لاستلامها؟`;
 if(t==="cancel")return hi+`علمنا أنكم ألغيتم طلبيتكم، ونودّ معرفة السبب لنساعدكم: هل المشكلة في المقاس أو اللون أو موعد التسليم؟\n`+o+`يمكننا تغيير المقاس أو تعديل الموعد بسهولة 🙏`;
 return hi+`نتابع معكم طلبيتكم:\n`+o+`نرجو تأكيد العنوان الصحيح (البلدية والحي) وموعد التسليم المناسب لكم.`;
}
function item(p){
 const g=grp(p.group),m=msg(g.m,p),d=DONE.has(p.tracking),num=p.phone.replace(/\D/g,"");
 const el=document.createElement("div");el.className="it"+(d?" isdone":"");el.style.setProperty("--c",g.c);
 el.innerHTML=`<div class="r1x"><div class="nm">${esc(clean(p.name))}</div><div class="amt"><span class="num">${fmt(p.amount)}</span> <small>دج</small></div></div>
 <div class="meta"><span>${IC.pin}${esc(p.wilaya.replace(/^\d+\s/,""))} · ${esc(p.commune)}</span><span>${IC.box}${p.deliveryType==="pickup-point"?"استلام من المكتب":"توصيل للمنزل"}</span><span>${IC.ph}<span class="num">${esc(p.phone.replace("+213","0"))}</span></span></div>
 <div class="prd">${esc(p.products)}</div>
 <div class="ft"><span class="st">${esc(sit(p.situation))}</span>
  <div class="acts"><a class="ab call" href="tel:${esc(p.phone)}">${IC.call}اتصال</a><a class="ab wa" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(m)}" aria-label="واتساب">${IC.wa}</a><button class="ab cp" aria-label="نسخ الرسالة">${IC.copy}</button><button class="ab done" aria-label="تم">${IC.check}</button></div></div>
 <div class="trk num">${esc(p.tracking)}</div>`;
 el.querySelector(".done").onclick=()=>{d?DONE.delete(p.tracking):DONE.add(p.tracking);saveDone();render();toast(d?"أُعيدت إلى القائمة":"تمت المتابعة ✓")};
 el.querySelector(".cp").onclick=async()=>{try{await navigator.clipboard.writeText(m);toast("نُسخت الرسالة")}catch(e){toast("تعذّر النسخ")}};
 return el;
}
function render(){
 const P=DATA.parcels,q=document.getElementById("q").value.trim().toLowerCase();
 const d=new Date(DATA.updatedAt);
 document.getElementById("upd").textContent=`${d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} · ${d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}`;
 const risk=P.filter(p=>["r3","r2","r1"].includes(p.group)),tot=risk.reduce((a,p)=>a+p.amount,0);
 document.getElementById("riskAmt").textContent=fmt(tot);
 document.getElementById("riskBar").innerHTML=["r3","r2","r1"].map(k=>{const s=P.filter(p=>p.group===k).reduce((a,p)=>a+p.amount,0);return tot?`<i style="width:${s/tot*100}%;background:${grp(k).c}"></i>`:""}).join("");
 const dn=P.filter(p=>DONE.has(p.tracking)).length;
 document.getElementById("progTxt").textContent=`${dn}/${P.length}`;
 document.getElementById("progBar").style.width=P.length?dn/P.length*100+"%":"0";
 const open=P.filter(p=>!DONE.has(p.tracking));
 document.getElementById("tabs").innerHTML=`<button class="tab ${filter==="all"?"on":""}" data-f="all">الكل <em class="num">${open.length}</em></button>`+
  G.map(g=>{const n=open.filter(p=>p.group===g.k).length;return `<button class="tab ${filter===g.k?"on":""}" data-f="${g.k}"><i style="background:${g.c}"></i>${g.t} <em class="num">${n}</em></button>`}).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();window.scrollTo({top:document.querySelector(".tabs").offsetTop,behavior:"smooth"})});
 const match=p=>!q||[p.name,p.phone,p.phone.replace("+213","0"),p.wilaya,p.commune,p.tracking,p.products].join(" ").toLowerCase().includes(q);
 const L=document.getElementById("list");L.innerHTML="";let shown=0;
 G.forEach(g=>{
  if(filter!=="all"&&filter!==g.k)return;
  const items=open.filter(p=>p.group===g.k&&match(p)).sort((a,b)=>b.amount-a.amount);
  if(!items.length)return;shown+=items.length;
  const s=document.createElement("section");s.className="sec";
  s.innerHTML=`<div class="sh"><div><h2><i style="background:${g.c}"></i>${g.full}</h2><p>${g.h}</p></div><span class="num">${items.length} · ${fmt(items.reduce((a,p)=>a+p.amount,0))} دج</span></div>`;
  items.forEach(p=>s.appendChild(item(p)));L.appendChild(s);
 });
 const doneItems=P.filter(p=>DONE.has(p.tracking)&&match(p)&&(filter==="all"||p.group===filter));
 if(doneItems.length){const b=document.createElement("details");b.className="donebox";b.innerHTML=`<summary>✓ تمت متابعتها (${doneItems.length}) — اضغطي للعرض</summary>`;doneItems.forEach(p=>b.appendChild(item(p)));L.appendChild(b)}
 if(!shown&&!doneItems.length)L.innerHTML=`<div class="empty">لا توجد طلبيات تحتاج متابعة هنا 🎉</div>`;
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pin,enc){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct))));
}
const fetchEnc=async()=>(await fetch("data.enc.json?t="+Date.now(),{cache:"no-store"})).json();
async function load(manual){const rf=document.getElementById("rf");rf.classList.add("spin");try{DATA=await decrypt(PIN,await fetchEnc());render();manual&&toast("القائمة محدَّثة")}catch(e){manual&&toast("تعذّر التحديث")}rf.classList.remove("spin")}
async function tryPin(pin){
 try{DATA=await decrypt(pin,await fetchEnc());PIN=pin;try{localStorage.setItem("panda_pin",pin)}catch(_){}
  document.getElementById("gate")?.remove();render();setInterval(load,5*60*1000);return true}catch(e){return false}
}
document.getElementById("rf").onclick=()=>PIN&&load(true);
document.getElementById("q").oninput=()=>DATA&&render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PIN)load()});
document.getElementById("gateForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("gbtn");b.textContent="…";
 if(!(await tryPin(document.getElementById("pin").value.trim()))){document.getElementById("err").textContent="الرمز غير صحيح";b.textContent="دخول"}};
(function(){let p=null;try{p=localStorage.getItem("panda_pin")}catch(e){}if(p)tryPin(p)})();
</script>
